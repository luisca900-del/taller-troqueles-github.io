<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2937">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Estado de Máquinas y Troqueles</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f5f7;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#d6dae0;--ac:#1f6feb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e232a;--tx:#eceff3;--mu:#98a2b3;--bd:#343b45;--ac:#5b9bff}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e232a;--tx:#eceff3;--mu:#98a2b3;--bd:#343b45;--ac:#5b9bff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:14px;max-width:720px;margin-inline:auto}
h1{font-size:19px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.top{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{border-top:1px solid var(--bd);padding:10px 0}
.m:first-of-type{border-top:0}
.m b{display:inline-block;margin-bottom:6px}
.g{display:grid;grid-template-columns:3fr 2fr;gap:8px}
.g2{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.sum span{flex:1;min-width:70px;text-align:center;border-radius:10px;padding:8px 4px;font-size:12px;color:#fff}
.sum strong{display:block;font-size:20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{padding:12px;border:0;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;background:var(--ac);color:#fff}
button.s{background:var(--bd);color:var(--tx)}
button.w{background:#25a244;grid-column:1/-1}
img{width:100%;border-radius:10px;border:1px solid var(--bd);margin-top:10px;display:block}
.msg{font-size:13px;color:var(--mu);margin-top:8px}
</style>
</head>
<body>
<h1>📋 Estado de Máquinas y Troqueles</h1>
<div class="card top">
  <div><label>FECHA</label><input type="date" id="fecha"></div>
  <div><label>TURNO</label><select id="turno"><option>1</option><option>2</option><option>3</option></select></div>
</div>
<div class="sum" id="sum"></div>
<div class="card" id="rows"></div>
<div class="btns">
  <button id="gen">🖼️ Generar imagen</button>
  <button class="s" id="clr">Limpiar datos</button>
  <button class="w" id="wa" hidden>📲 Compartir por WhatsApp</button>
</div>
<div class="msg" id="msg"></div>
<img id="out" alt="" hidden>

<script>
const MAQ=["FLR2","FLR4","FLR5","FLR6","FLR9","FLR10","FLR13","FLR14","FLR17"];
const EST={"Operando":"#2da44e","Parada":"#d1242f","Mantenimiento":"#e8a317","Cambio de troquel":"#8250df","Ajuste":"#0e8fa8","Sin operario":"#c2410c","Pruebas":"#d9468f","Sin programa":"#6e7781"};
const $=id=>document.getElementById(id);
let D={fecha:new Date().toISOString().slice(0,10),turno:"1",r:{}};
MAQ.forEach(m=>D.r[m]={f:"",t:"",rf:"",e:"Operando"});
try{const s=localStorage.getItem("trq");if(s){const o=JSON.parse(s);if(o&&o.r)D=Object.assign(D,o)}}catch(e){}
function save(){try{localStorage.setItem("trq",JSON.stringify(D))}catch(e){}}
$("fecha").value=D.fecha;$("turno").value=D.turno;
$("fecha").oninput=e=>{D.fecha=e.target.value;save()};
$("turno").onchange=e=>{D.turno=e.target.value;save()};
const rows=$("rows");
MAQ.forEach(m=>{
  const d=document.createElement("div");d.className="m";
  d.innerHTML=`<b>${m}</b><div class="g"><div><label>TROQUEL (Ø / ▭)</label><div style="display:flex;gap:4px"><select data-k="f" data-m="${m}" style="width:58px;padding:9px 2px;font-size:18px"><option value="">–</option><option>Ø</option><option>▭</option></select><input data-k="t" data-m="${m}" value="" style="min-width:0"></div></div><div><label>ESTADO</label><select data-k="e" data-m="${m}">${Object.keys(EST).map(x=>`<option>${x}</option>`).join("")}</select></div></div><div class="g2"><div><label>REFERENCIA</label><input data-k="rf" data-m="${m}" value="" style="min-width:0"></div></div>`;
  rows.appendChild(d);
  d.querySelectorAll("[data-k]").forEach(el=>{el.value=D.r[m][el.dataset.k]||"";
    el.addEventListener("input",()=>{D.r[m][el.dataset.k]=el.value;save();sum()})});
});
function sum(){
  const c={};MAQ.forEach(m=>{const e=D.r[m].e;c[e]=(c[e]||0)+1});
  $("sum").innerHTML=Object.keys(EST).filter(k=>c[k]).map(k=>`<span style="background:${EST[k]}"><strong>${c[k]}</strong>${k}</span>`).join("");
}
sum();
function fmt(f){if(!f)return"—";const [y,m,d]=f.split("-");return `${d}/${m}/${y}`}
function draw(){
  const W=1080,RH=96,H=300+RH*MAQ.length+60,cv=document.createElement("canvas");
  cv.width=W;cv.height=H;const x=cv.getContext("2d");
  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  x.fillStyle="#1f2937";x.fillRect(0,0,W,150);
  x.fillStyle="#fff";x.font="bold 50px sans-serif";x.textBaseline="middle";
  x.fillText("ESTADO DE MÁQUINAS Y TROQUELES",40,55);
  x.font="36px sans-serif";x.fillText("FECHA: "+fmt(D.fecha)+"     TURNO: "+D.turno,40,110);
  const cols=[40,190,500,760,1040];
  const y0=170;
  x.fillStyle="#e5e7eb";x.fillRect(40,y0,1000,70);
  x.fillStyle="#111";x.font="bold 30px sans-serif";
  ["MÁQUINA","TROQUEL","REFERENCIA","ESTADO"].forEach((h,i)=>x.fillText(h,cols[i]+14,y0+35));
  MAQ.forEach((m,i)=>{
    const y=y0+70+i*RH,r=D.r[m];
    x.fillStyle=i%2?"#f9fafb":"#fff";x.fillRect(40,y,1000,RH);
    x.fillStyle="#111";x.font="bold 36px sans-serif";x.fillText(m,cols[0]+14,y+RH/2);
    x.font="30px sans-serif";x.fillText(((r.f?r.f+" ":"")+(r.t||"—")).slice(0,16),cols[1]+14,y+RH/2);
    x.fillText((r.rf||"—").slice(0,13),cols[2]+14,y+RH/2);
    x.fillStyle=EST[r.e];x.beginPath();x.roundRect(cols[3]+10,y+18,260,RH-36,14);x.fill();
    x.fillStyle="#fff";x.font="bold 25px sans-serif";x.textAlign="center";
    x.fillText(r.e,cols[3]+140,y+RH/2);x.textAlign="left";
  });
  const yb=y0+70+MAQ.length*RH;
  x.strokeStyle="#9ca3af";x.lineWidth=2;x.strokeRect(40,y0,1000,yb-y0);
  for(let i=0;i<=MAQ.length;i++){x.beginPath();x.moveTo(40,y0+70+i*RH);x.lineTo(1040,y0+70+i*RH);x.stroke()}
  [190,500,760].forEach(cx=>{x.beginPath();x.moveTo(cx,y0);x.lineTo(cx,yb);x.stroke()});
  return cv;
}
let blob=null;
const toBlob=cv=>new Promise(r=>cv.toBlob(r,"image/png"));
$("gen").onclick=async()=>{
  const cv=draw();blob=await toBlob(cv);
  $("out").src=cv.toDataURL("image/png");$("out").hidden=false;$("wa").hidden=false;
  $("msg").textContent="Imagen lista. Toca “Compartir por WhatsApp” o guárdala.";
};
$("wa").onclick=async()=>{
  const name=`troqueles_${D.fecha}_T${D.turno}.png`;
  try{
    const f=new File([blob],name,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:"Estado de máquinas"});return}
  }catch(e){if(e&&e.name==="AbortError")return}
  try{
    const dl=window.claude&&await window.claude.use("downloads");
    if(dl){await dl.save({filename:name,data:blob});$("msg").textContent="Imagen guardada. Ábrela y envíala por WhatsApp.";return}
  }catch(e){}
  $("msg").textContent="Mantén presionada la imagen y elige Guardar o Compartir.";
};
$("clr").onclick=()=>{
  MAQ.forEach(m=>D.r[m]={f:"",t:"",rf:"",e:"Operando"});
  rows.querySelectorAll("[data-k]").forEach(el=>{el.value=D.r[el.dataset.m][el.dataset.k]});
  save();sum();$("out").hidden=true;$("wa").hidden=true;
};
rows.addEventListener("change",sum);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
